<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        p {
            color: #666;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .todo-list {
            list-style: none;
            padding: 0;
        }
        .todo-item {
            background: #fafafa;
            border: 1px solid #eee;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }
        .todo-item:hover {
            transform: scale(1.02);
        }
        .checkbox {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            accent-color: #4CAF50;
        }
        .done {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo App</h1>
        <p>A simple project built as part of the Winter Arc Bootcamp. Organize your tasks efficiently.</p>
        
        <ul class="todo-list">
            <li class="todo-item">
                <input type="checkbox" class="checkbox" checked>
                <span class="done">Complete Project Setup</span>
            </li>
            <li class="todo-item">
                <input type="checkbox" class="checkbox">
                <span>Design UI/UX Mockups</span>
            </li>
            <li class="todo-item">
                <input type="checkbox" class="checkbox">
                <span>Develop Backend APIs</span>
            </li>
            <li class="todo-item">
                <input type="checkbox" class="checkbox">
                <span>Deploy to Vercel</span>
            </li>
        </ul>
    </div>
</body>
</html>
